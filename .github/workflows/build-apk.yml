name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Enjazati APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Inject Latest Firebase Config & Auth Code
        run: |
          echo "" | base64 -d > firebase-applet-config.json
          echo "" | base64 -d > src/firebase.ts

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Licenses & Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Ensure Android Project Files & Keystore
        run: |
          mkdir -p android/app
          echo "" | base64 -d > android/app/debug.keystore
          echo "" | base64 -d > android/app/google-services.json

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Fix Compatibility & Dependencies
        run: |
          sed -i "s/androidxActivityVersion = '1.11.0'/androidxActivityVersion = '1.9.3'/g" android/variables.gradle || true
          sed -i "s/androidxAppCompatVersion = '1.7.1'/androidxAppCompatVersion = '1.7.0'/g" android/variables.gradle || true
          sed -i "s/androidxCoordinatorLayoutVersion = '1.3.0'/androidxCoordinatorLayoutVersion = '1.2.0'/g" android/variables.gradle || true
          sed -i "s/androidxCoreVersion = '1.17.0'/androidxCoreVersion = '1.15.0'/g" android/variables.gradle || true
          sed -i "s/androidxFragmentVersion = '1.8.9'/androidxFragmentVersion = '1.8.5'/g" android/variables.gradle || true
          sed -i "s/coreSplashScreenVersion = '1.2.0'/coreSplashScreenVersion = '1.0.1'/g" android/variables.gradle || true
          sed -i "s/androidxWebkitVersion = '1.14.0'/androidxWebkitVersion = '1.12.1'/g" android/variables.gradle || true
          sed -i '/default_web_client_id/d' android/app/src/main/res/values/strings.xml || true

          node -e " const fs = require('fs'); let file = fs.readFileSync('android/app/build.gradle', 'utf8'); if (!file.includes('kotlin-bom')) {   file = file.replace('dependencies {', \"dependencies {\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')\"); } if (!file.includes('resolutionStrategy.eachDependency')) {   file += \"\nconfigurations.all {\n    resolutionStrategy.eachDependency { DependencyResolveDetails details ->\n        if (details.requested.group == 'org.jetbrains.kotlin' && (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {\n            details.useTarget('org.jetbrains.kotlin:kotlin-stdlib:1.8.22')\n        }\n    }\n}\n\"; } if (!file.includes(\"storeFile file('debug.keystore')\")) {   file = file.replace('android {', \"android {\n    signingConfigs {\n        debug {\n            storeFile file('debug.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\");   file = file.replace(/buildTypes\s*\{\s*debug\s*\{/g, \"buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\");   if (!file.includes('signingConfig signingConfigs.debug')) {     file = file.replace('buildTypes {', \"buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }\");   } } fs.writeFileSync('android/app/build.gradle', file); "

          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Display Signing Fingerprint (SHA-1)
        run: |
          echo "=================================================="
          echo "SHA-1 Fingerprint used for APK signing:"
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:" || true
          echo "=================================================="

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Enjazati-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error 
