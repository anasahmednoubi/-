function ico(v,sz){
  v=String(v||"");let n=null;
  if(v.indexOf("i:")===0)n=v.slice(2);else n=EMAP[v.replace(/\uFE0F/g,"")]||null;
  if(n&&ICO[n])return '<svg class="ic" width="'+(sz||"1em")+'" height="'+(sz||"1em")+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICO[n]+'</svg>';
  return esc(v);
}

function pct(t){return Math.min(100,Math.round(t.done/t.target*100))}
function col(p){if(p===null||p===undefined)return "var(--mute)";return "hsl("+Math.round(p*1.25)+",72%,44%)"}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function msg(t){
  const p=pct(t);
  if(p>=100)return ""+T("مبروك! أنجزت المهمة بالكامل")+"";
  return ""+T("أنجزت")+" "+p+"% "+T("من المهمة")+"";
}
const PP={},PT={},SUM={v:null,to:null,l:0,t:0};
let animOn=false,lastT=0;
function kick(){if(!animOn){animOn=true;lastT=performance.now();requestAnimationFrame(loop)}}
function loop(now){
  const dt=Math.min(64,Math.max(1,now-lastT));lastT=now;
  const k=1-Math.exp(-dt/340);let busy=false;
  if(SUM.to!==null&&SUM.v!==SUM.to){
    const d=SUM.to-SUM.v;
    if(Math.abs(d)<.15)SUM.v=SUM.to;else{SUM.v+=d*k;busy=true}
    const el=document.getElementById("dSum");
    if(el&&el.offsetParent!==null)el.innerHTML=ringD(SUM.l,SUM.t,SUM.v);
  }
  for(const key in PT){
    const to=PT[key];let v=PP[key];if(v===undefined)v=to;
    if(v!==to){const d=to-v;if(Math.abs(d)<.15)v=to;else{v+=d*k;busy=true}PP[key]=v}
  }
  document.querySelectorAll(".fill[data-pf]").forEach(e=>{const key=e.dataset.pf+e.dataset.k,v=PP[key];if(v!==undefined){e.style.width=v+"%";e.style.background=col(v);const tg=PT[key],mv=tg!==undefined&&tg!==v;e.classList.toggle("wf",mv&&tg>v);e.classList.toggle("we",mv&&tg<v)}});
  if(busy)requestAnimationFrame(loop);else animOn=false;
}
function animBars(box,pf,defer){
  const fl=box.querySelectorAll(".fill[data-to]");if(!fl.length)return;
  const hid=box.offsetParent===null;
  fl.forEach(e=>{
    const key=pf+e.dataset.k,to=+e.dataset.to;e.dataset.pf=pf;
    if(PP[key]===undefined)PP[key]=to;
    if(hid&&defer)return;
    if(hid){PP[key]=to;PT[key]=to;e.style.width=to+"%";e.style.background=col(to);return}
    PT[key]=to;
  });
  if(!hid)kick();
}

function addTask(){
  const n=document.getElementById("n"),tt=document.getElementById("t"),u=document.getElementById("u");
  const target=parseFloat(tt.value);
  if(!n.value.trim()||!(target>0))return;
  tasks.unshift({id:Date.now(),icon:ic.T,name:n.value.trim(),target:target,unit:u.value.trim(),daily:parseFloat(document.getElementById("td").value)||0,done:0,finished:false,pr:prRead("tpr")});
  n.value="";tt.value="";u.value="";document.getElementById("td").value="";{const q=document.getElementById("tpr");if(q)q.value="-1"}save();render();
}
function addAmt(id){
  const t=tasks.find(x=>x.id===id),i=document.getElementById("a"+id);
  const v=parseFloat(i.value);
  if(!(v>0))return;
  const add=Math.min(t.target-t.done,v);
  if(!(add>0))return;
  t.done+=add;t.prev=(t.prev||0)+add;t.prevUsed=true;
  if(t.done>=t.target)t.finished=true;
  save();render();
}
function finish(id){
  const t=tasks.find(x=>x.id===id);
  t.finished=true;t.fin=key(today());save();render();playTone(TN.n);
}
function del(id){tasks=tasks.filter(x=>x.id!==id);save();render()}
function doneT(id){
  const t=tasks.find(x=>x.id===id),k=key(today());
  if(!t)return;
  if(t.dk===k){
    t.done=Math.max(0,t.done-(t.dadd||0));
    t.finished=false;delete t.fin;delete t.dk;delete t.dadd;
    const hh=t.hist||[];
    for(let i=hh.length-1;i>=0;i--){if(hh[i].m){hh.splice(i,1);break}}
  }else if(!t.finished){
    openAmt(id);return;
  }
  save();render();
}
function openAmt(id){
  const t=tasks.find(x=>x.id===id);
  if(!t)return;
  const rem=Math.max(0,t.target-t.done);
  const m=document.getElementById("modal");
  m.innerHTML='<div class="sheet"><b>'+T("كم أنجزت اليوم؟")+'</b><div class="sub" style="margin-top:4px">'+ico(t.icon||"i:pin")+' '+esc(t.name)+' — '+T("المتبقي")+' '+rem+' '+esc(t.unit)+'</div><div class="row" style="margin-top:10px"><input class="name" id="amt" type="number" min="1" inputmode="numeric" placeholder="'+T("العدد الذي أنجزته")+' '+esc(t.unit)+'" value="'+(t.daily>0?Math.min(t.daily,rem):"")+'"><button onclick="confirmAmt('+id+')">'+T("تسجيل")+'</button><button class="ghost" onclick="closeEdit()">'+T("إلغاء")+'</button></div></div>';
  openM(m);
  setTimeout(()=>{const a=document.getElementById("amt");if(a)a.focus()},50);
}
function confirmAmt(id){
  const t=tasks.find(x=>x.id===id),k=key(today());
  const v=parseFloat(document.getElementById("amt").value);
  if(!t||!(v>0))return;
  const add=Math.min(t.target-t.done,v);
  if(add>0)(t.hist=t.hist||[]).push({d:k,a:add,m:1});
  t.done+=add;t.dk=k;t.dadd=add;
  if(t.done>=t.target){t.finished=true;t.fin=k}
  closeEdit();save();render();playTone(TN.n);showNote(T("إنجازاتي"),T("أحسنت! تم تسجيل تقدمك في:")+" "+t.name);
}

let dg=null;
document.addEventListener("pointerdown",function(e){

  if(!row)return;
  const rows=Array.from(row.parentElement.children).filter(c=>c.querySelector(".drag"));
  const gap=row.classList.contains("chk")?0:12;
  dg={h:h,row:row,rows:rows,si:rows.indexOf(row),ni:rows.indexOf(row),y0:e.clientY,rects:rows.map(c=>c.getBoundingClientRect())};
  dg.hh=dg.rects[dg.si].height+gap;
  try{h.setPointerCapture(e.pointerId)}catch(x){}
  row.classList.add("dragging");
  rows.forEach(c=>{if(c!==row)c.style.transition="transform .15s"});
  e.preventDefault();
});
document.addEventListener("pointermove",function(e){
  if(!dg)return;
  const dy=e.clientY-dg.y0;
  dg.row.style.transform="translateY("+dy+"px)";
  const ctr=dg.rects[dg.si].top+dg.rects[dg.si].height/2+dy;
  let ni=0;
  dg.rects.forEach((r,i)=>{if(i!==dg.si&&r.top+r.height/2<ctr)ni++});
  dg.ni=ni;
  dg.rows.forEach((c,i)=>{
    if(i===dg.si)return;
    let s=0;
    if(dg.si<ni&&i>dg.si&&i<=ni)s=-dg.hh;
    else if(dg.si>ni&&i>=ni&&i<dg.si)s=dg.hh;
    c.style.transform=s?"translateY("+s+"px)":"";
  });
});

function setAdd(box,o){
  if(box._a){box._a.cancel();box._a=null;box.classList.remove("anim")}
  if(box._b){box._b.classList.toggle("on",o);box._b.setAttribute("aria-expanded",o?"true":"false")}
  const was=box.classList.contains("open");
  if(o===was)return;
  if(o)box.classList.add("open");
  if(!box.animate){if(!o)box.classList.remove("open");return}
  const cs=getComputedStyle(box);
  const full={height:cs.height,paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,marginBottom:cs.marginBottom,borderTopWidth:cs.borderTopWidth,borderBottomWidth:cs.borderBottomWidth,opacity:1,transform:"none"};
  const zero={height:"0px",paddingTop:"0px",paddingBottom:"0px",marginBottom:"0px",borderTopWidth:"0px",borderBottomWidth:"0px",opacity:0,transform:"translate3d(0,-8px,0)"};
  box.classList.add("anim");
  const a=box.animate(o?[zero,full]:[full,zero],{duration:340,easing:"cubic-bezier(.4,0,.2,1)",fill:"both"});
  box._a=a;
  a.onfinish=()=>{box._a=null;if(!o)box.classList.remove("open");box.classList.remove("anim");a.cancel()};
}

const TK="tour-v2",TA={"D": ["i:calendar", "تبويب اليوم", "يومك كله في مكان واحد.", ["دائرة تبيّن المتبقي لك اليوم ونسبة إنجازك", "روتين اليوم: علّم على كل عادة بمجرد إنجازها", "مهام اليوم: سجّل كمية ما أنجزته من كل مهمة", "اسحب يمينًا أو يسارًا للتنقل بين التبويبات"]], "T": ["i:check", "تبويب المهام", "للأهداف التي لها كمية، مثل مذاكرة 20 صفحة.", ["اضغط زر + لإضافة مهمة: اختر أيقونة ثم اكتب الاسم والكمية والوحدة", "سجّل ما أنجزته كل يوم وتابع شريط التقدم والنسبة", "أنهِ المهمة عند اكتمالها، أو عدّلها أو احذفها من زر النقاط الثلاث", "زر ترتيب يتيح لك سحب المهام لإعادة ترتيبها"]], "R": ["i:repeat", "تبويب الروتين", "للعادات المتكررة، مثل الرياضة كل يوم.", ["أضف روتينًا واختر أيامه: أيام الأسبوع أو أيام محددة من الشهر", "علّم كل يوم في جدول الأسبوع عند إنجازه", "بدّل بين عرض الأسبوع والشهر لمتابعة التزامك"]], "S": ["i:chart", "تبويب الإحصائيات", "تابع تقدمك مع الوقت.", ["نسبة إنجازك الكلي خلال الأسبوع أو الشهر", "رسم بياني يومي لنشاطك", "تفاصيل المهام: المغلقة وما عملت عليه ومتوسط الإنجاز", "تفاصيل كل روتين مع الأفضل والأضعف، واضغط على أي روتين لتشاهد تقويمه"]], "H": ["i:dots", "زر المزيد", "الدائرة في أسفل الشاشة تفتح حسابك وإعداداتك.", ["اسمك وملخص بياناتك", "الخط وحجمه", "المظهر (فاتح أو داكن أو تلقائي) واللغة", "مسح البيانات، وإعادة هذه الجولة في أي وقت"]]},TE={"D": ["Today tab", "Your whole day in one place.", ["A ring showing what's left for today and your completion rate", "Today's routine: tick each habit as you finish it", "Today's tasks: log how much you did on each task", "Swipe left or right to switch between tabs"]], "T": ["Tasks tab", "For goals with an amount, like studying 20 pages.", ["Tap + to add a task: pick an icon, then enter the name, quantity and unit", "Log what you did each day and follow the progress bar and percentage", "Finish a task when it's complete, or edit or delete it from the three-dot button", "The Reorder button lets you drag tasks into your preferred order"]], "R": ["Routine tab", "For repeating habits, like exercising every day.", ["Add a routine and choose its days: weekdays or specific days of the month", "Tick each day on the weekly grid when you complete it", "Switch between week and month views to track your consistency"]], "S": ["Stats tab", "Follow your progress over time.", ["Your overall completion rate for the week or month", "A daily chart of your activity", "Task details: closed tasks, tasks you worked on and average completion", "Details for each routine with best and weakest; tap any routine to see its calendar"]], "H": ["Home button", "The round button at the bottom opens your account and settings.", ["Your name and data summary", "Font and font size", "Appearance (light, dark, auto) and language", "Erase data, and replay this tutorial any time"]]};
function tourSeen(){try{return JSON.parse(localStorage.getItem(TK)||"{}")||{}}catch(e){return {}}}
function tourSave(o){try{localStorage.setItem(TK,JSON.stringify(o))}catch(e){}}
let tourLive=false;try{if(localStorage.getItem(TK)===null){tourLive=true;tourSave({})}}catch(e){}
function hintClose(){const el=document.getElementById("tour");if(el)el.remove()}
function hintSkip(){const o=tourSeen();o.off=1;tourSave(o);hintClose()}
function tourReset(){tourLive=true;tourSave({});hintTab(curTab)}
function hintTab(n){
  hintClose();const o=tourSeen();if(!tourLive||o.off||o[n]||!TA[n])return;o[n]=1;tourSave(o);
  const a=TA[n],e=TE[n],en=lang==="en";
  const pts=(en?e[2]:a[3]).map(x=>'<div style="display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:14px"><span style="color:var(--acc);flex:none;margin-top:2px">'+ico("i:check","15px")+'</span><span>'+x+'</span></div>').join("");
  const el=document.createElement("div");el.id="tour";
  el.style.cssText="position:fixed;z-index:90;left:12px;right:12px;margin:0 auto;max-width:536px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-height:60%;overflow-y:auto;background:var(--card);color:var(--text);border:1.5px solid var(--acc);border-radius:18px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.28);animation:hin .38s ease-out";
  el.innerHTML='<div style="display:flex;align-items:center;gap:10px"><div style="width:38px;height:38px;border-radius:50%;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none">'+ico(a[0],"20px")+'</div><div style="min-width:0"><div style="font-size:17px;font-weight:700">'+(en?e[0]:a[1])+'</div><div class="sub">'+(en?e[1]:a[2])+'</div></div></div>'+pts
   +'<div style="display:flex;gap:8px;align-items:center;margin-top:12px"><button class="ghost" onclick="hintSkip()">'+T("تخطي الجولة")+'</button><span style="flex:1"></span><button onclick="hintClose()">'+T("فهمت")+'</button></div>';
  document.body.appendChild(el);
}
if(lang==="en")applyLang();
setTimeout(()=>hintTab("D"),600);

<script>
/* ===== ربط جوجل الحقيقي + المزامنة عبر Firebase =====
   1) أنشئ مشروعًا في Firebase Console وفعّل Authentication (Google) و Firestore.
   2) الصق إعدادات المشروع مكان null.
   لو تركتها null يفضل البرنامج يشتغل زي ما هو بالظبط. */
const FIREBASE_CONFIG=null;
/* مثال: {apiKey:"...",authDomain:"xxx.firebaseapp.com",projectId:"xxx",appId:"..."} */

Object.assign(EN,{"المهام المنتهية":"Finished tasks","كم أنجزت سابقًا؟":"How much did you do before?","تعذر تسجيل الدخول بجوجل":"Google sign-in failed","تسجيل الدخول بجوجل حقيقي، وبياناتك تُحفظ وتتزامن على حسابك بين كل أجهزتك.":"Real Google sign-in. Your data is saved and synced to your account across all your devices."});

const Backend={
  kind:"none",user:null,
  async init(){
    if(!FIREBASE_CONFIG)return false;
    try{
      const B="https://www.gstatic.com/firebasejs/10.12.2/";
      const [A,Au,Fs]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
      const app=A.initializeApp(FIREBASE_CONFIG);
      this.Au=Au;this.Fs=Fs;this.auth=Au.getAuth(app);this.fs=Fs.getFirestore(app);
      await new Promise(r=>{const u=Au.onAuthStateChanged(this.auth,x=>{this.setU(x);u();r()})});
      this.kind="firebase";return true;
    }catch(e){return false}
  },
  setU(x){this.user=x?{uid:x.uid,name:x.displayName||"",email:x.email||""}:null},
  ready(){return this.kind==="firebase"&&!!this.user},
  async signIn(){
    const Au=this.Au,cap=window.Capacitor;
    if(cap&&cap.isNativePlatform&&cap.isNativePlatform()&&cap.Plugins&&cap.Plugins.FirebaseAuthentication){
      /* داخل تطبيق أندرويد/iOS: يحتاج الإضافة @capacitor-firebase/authentication */
      const r=await cap.Plugins.FirebaseAuthentication.signInWithGoogle({skipNativeAuth:true});
      await Au.signInWithCredential(this.auth,Au.GoogleAuthProvider.credential(r.credential.idToken));
    }else{
      await Au.signInWithPopup(this.auth,new Au.GoogleAuthProvider());
    }
    this.setU(this.auth.currentUser);return this.user;
  },
  async signOut(){try{await this.Au.signOut(this.auth)}catch(e){}this.user=null},
  async pull(){const s=await this.Fs.getDoc(this.Fs.doc(this.fs,"users",this.user.uid));return s.exists()?s.data():null},
  async push(d){return this.Fs.setDoc(this.Fs.doc(this.fs,"users",this.user.uid),d)}
};
function setDb(){CS.db=Backend.ready()?Backend:null;CS.id=Backend.user?Backend.user.uid:null;if(Backend.user&&Backend.user.name)CS.name=Backend.user.name}

/* نفس منطق المزامنة القديم لكن على Backend بدل حساب Claude */
cloudInit=async function(){
  await Backend.init();setDb();
  if(Backend.kind==="firebase"){
    if(Backend.user&&Backend.user.email&&!LNK.g){LNK.g=Backend.user.email;saveLnk()}
    if(!Backend.user&&LNK.g){delete LNK.g;saveLnk()}
  }
  CS.ready=true;if(CS.name)redrawAll();
  if(CS.db&&isLinked())cloudSync();else refreshLink();
};
cloudSync=async function(){
  if(!CS.db){CS.st="na";refreshLink();return false}
  CS.st="syn";refreshLink();
  try{
    const d=await Backend.pull(),hasLocal=tasks.length||routines.length;
    if(d&&(d.tasks||d.routines)&&d.ts>LTS){
      if(LTS===0&&hasLocal){tasks=mergeById(tasks,d.tasks);routines=mergeById(routines,d.routines)}
      else{tasks=d.tasks||[];routines=d.routines||[]}
      if(d.prof&&(!prof||!prof.name))prof=d.prof;
      try{localStorage.setItem(KEY,JSON.stringify(tasks));localStorage.setItem(RK,JSON.stringify(routines));localStorage.setItem(PK,JSON.stringify(prof))}catch(e){}
      if(LTS===0&&hasLocal){touchTs();await Backend.push({tasks:tasks,routines:routines,prof:prof,ts:LTS})}
      else{LTS=d.ts;try{localStorage.setItem("sync-ts-v1",String(LTS))}catch(e){}}
      redrawAll();
    }else{
      if(!LTS)touchTs();
      await Backend.push({tasks:tasks,routines:routines,prof:prof,ts:LTS});
    }
    CS.st="ok";CS.t=Date.now();
  }catch(e){CS.st="err"}
  refreshLink();return CS.st==="ok";
};
cloudPush=function(){
  touchTs();if(!CS.db||!isLinked())return;
  clearTimeout(cpT);
  cpT=setTimeout(async()=>{
    try{await Backend.push({tasks:tasks,routines:routines,prof:prof,ts:LTS});CS.st="ok";CS.t=Date.now()}catch(e){CS.st="err"}
    refreshLink();
  },1200);
};

/* زر "ربط الحساب بجوجل": دخول حقيقي بدل كتابة الإيميل */
doLink=async function(p){
  const FB=p==="g"&&Backend.kind==="firebase";let v="";
  if(FB){
    try{const u=await Backend.signIn();v=u.email||u.name||"Google"}
    catch(e){LERR=T("تعذر تسجيل الدخول بجوجل");renderH();return}
    setDb();
  }else{
    v=document.getElementById("lk"+p).value.trim();if(!v)return;
    if(p==="g"&&!/^\S+@\S+\.\S+$/.test(v)){LERR=T("اكتب بريد جوجل صحيح.");renderH();return}
  }
  LERR="";LNK[p]=v;LNK.last=p;saveLnk();renderH();inApp(T("ربط"),T(LP[p].t));
  cloudSync().then(ok=>{inApp(T("المزامنة"),T(ok?"تمت مزامنة البيانات":"المزامنة غير متاحة الآن"))});
};
unLink=function(p){
  delete LNK[p];LERR="";saveLnk();
  if(p==="g"&&Backend.kind==="firebase")Backend.signOut().then(()=>{setDb();CS.name="";renderH()});
  renderH();
};
{const _lp=linkPageHtml,OLD="تتم مزامنة بياناتك تلقائيًا بعد الربط وتُحفظ على حسابك في Claude، فتظهر على أي جهاز تفتح منه البرنامج بنفس الحساب. الربط نفسه لا يسجّل دخولًا فعليًا بجوجل أو فيسبوك.";
 linkPageHtml=function(p){
  let h=_lp(p);
  if(p==="g"&&Backend.kind==="firebase")h=h.replace(/<input id="lkg"[^>]*>/,"").replace(T(OLD),T("تسجيل الدخول بجوجل حقيقي، وبياناتك تُحفظ وتتزامن على حسابك بين كل أجهزتك."));
  return h;
 }}

/* ===== صفحة الحساب داخل زر "ربط": دخول / حساب جديد / جوجل ===== */
Object.assign(EN,{"تسجيل الدخول":"Sign in","حساب جديد":"New account","إنشاء الحساب":"Create account","البريد الإلكتروني":"Email","كلمة المرور":"Password","الاسم (اختياري)":"Name (optional)","نسيت كلمة المرور؟":"Forgot password?","أو":"or","المتابعة مع جوجل":"Continue with Google","تسجيل الخروج":"Sign out","اكتب بريدًا إلكترونيًا صحيحًا.":"Enter a valid email.","كلمة المرور 6 أحرف على الأقل.":"Password must be at least 6 characters.","أرسلنا رابط إعادة تعيين كلمة المرور إلى بريدك.":"We sent a password reset link to your email.","هذه معاينة: التسجيل الحقيقي يعمل داخل التطبيق بعد ربط Firebase.":"This is a preview: real sign-in works inside the app once Firebase is connected.","البريد أو كلمة المرور غير صحيحة":"Incorrect email or password","هذا البريد مسجّل بالفعل، سجّل الدخول بدلًا من ذلك.":"This email is already registered. Sign in instead.","كلمة المرور ضعيفة.":"Password is too weak.","تعذر الاتصال بالإنترنت.":"Couldn't connect to the internet.","تم إغلاق نافذة جوجل.":"The Google window was closed.","تعذر إتمام العملية. حاول مرة أخرى.":"Something went wrong. Try again.","محاولات كثيرة، حاول لاحقًا.":"Too many attempts. Try later."});
Backend.signUp=async function(e,p,n){const Au=this.Au,c=await Au.createUserWithEmailAndPassword(this.auth,e,p);if(n)await Au.updateProfile(c.user,{displayName:n});this.setU(this.auth.currentUser);return this.user};
Backend.signInEmail=async function(e,p){await this.Au.signInWithEmailAndPassword(this.auth,e,p);this.setU(this.auth.currentUser);return this.user};
Backend.reset=function(e){return this.Au.sendPasswordResetEmail(this.auth,e)};
const AUTH={mode:"in",e:"",p:"",n:"",err:"",info:"",busy:false};
function aerr(c){const m={"auth/invalid-credential":"البريد أو كلمة المرور غير صحيحة","auth/wrong-password":"البريد أو كلمة المرور غير صحيحة","auth/user-not-found":"البريد أو كلمة المرور غير صحيحة","auth/email-already-in-use":"هذا البريد مسجّل بالفعل، سجّل الدخول بدلًا من ذلك.","auth/weak-password":"كلمة المرور ضعيفة.","auth/invalid-email":"اكتب بريدًا إلكترونيًا صحيحًا.","auth/network-request-failed":"تعذر الاتصال بالإنترنت.","auth/popup-closed-by-user":"تم إغلاق نافذة جوجل.","auth/too-many-requests":"محاولات كثيرة، حاول لاحقًا."};return T(m[c]||"تعذر إتمام العملية. حاول مرة أخرى.")}
function aIn(k,v){AUTH[k]=v}
function aMode(m){AUTH.mode=m;AUTH.err="";AUTH.info="";renderH()}
function aNoFb(){if(Backend.kind=="firebase")return false;AUTH.err=T("هذه معاينة: التسجيل الحقيقي يعمل داخل التطبيق بعد ربط Firebase.");renderH();return true}
async function afterAuth(u){setDb();if(u.name)CS.name=u.name;LNK.g=u.email||u.name||"Google";LNK.last="g";saveLnk();AUTH.p="";cloudSync().then(ok=>inApp(T("المزامنة"),T(ok?"تمت مزامنة البيانات":"المزامنة غير متاحة الآن")))}
async function aRun(fn){AUTH.busy=true;AUTH.err="";AUTH.info="";renderH();try{await afterAuth(await fn())}catch(x){AUTH.err=aerr(x&&x.code)}AUTH.busy=false;renderH()}
function aSubmit(){
  if(AUTH.busy)return;const e=AUTH.e.trim(),p=AUTH.p;
  if(!/^\S+@\S+\.\S+$/.test(e)){AUTH.err=T("اكتب بريدًا إلكترونيًا صحيحًا.");return renderH()}
  if(p.length<6){AUTH.err=T("كلمة المرور 6 أحرف على الأقل.");return renderH()}
  if(aNoFb())return;
  aRun(()=>AUTH.mode==="up"?Backend.signUp(e,p,AUTH.n.trim()):Backend.signInEmail(e,p));
}
function aGoogle(){if(AUTH.busy||aNoFb())return;aRun(()=>Backend.signIn())}
async function aReset(){
  const e=AUTH.e.trim();if(!/^\S+@\S+\.\S+$/.test(e)){AUTH.err=T("اكتب بريدًا إلكترونيًا صحيحًا.");return renderH()}
  if(aNoFb())return;
  try{await Backend.reset(e);AUTH.err="";AUTH.info=T("أرسلنا رابط إعادة تعيين كلمة المرور إلى بريدك.")}catch(x){AUTH.err=aerr(x&&x.code)}renderH();
}
linkListHtml=function(){
  const u=Backend.user,v=LNK.g,fb=Backend.kind==="firebase";
  if(v||u){
    return '<div class="task"><div style="display:flex;align-items:center;gap:12px">'+lnkBadge("g",44)+'<div style="flex:1;min-width:0"><div style="font-weight:700;overflow:hidden;text-overflow:ellipsis" dir="auto">'+esc(v||(u&&u.email)||"")+'</div><div style="color:#16a34a;font-size:13px;margin-top:2px">'+T("مرتبط")+'</div></div></div>'+syncBlock()+'<button class="ghost" style="width:100%;margin-top:14px;color:#d33" onclick="unLink(\'g\')">'+T("تسجيل الخروج")+'</button></div>';
  }
  const up=AUTH.mode==="up",dis=AUTH.busy?" disabled":"";
  const inp=(k,t,ph,ac)=>'<input type="'+t+'" dir="auto" autocomplete="'+ac+'" style="width:100%;margin-top:10px" placeholder="'+T(ph)+'" value="'+esc(AUTH[k])+'" oninput="aIn(\''+k+'\',this.value)">';
  const seg=[["in","تسجيل الدخول"],["up","حساب جديد"]].map(x=>'<button class="chip '+(AUTH.mode===x[0]?"on":"")+'" style="flex:1" onclick="aMode(\''+x[0]+'\')">'+T(x[1])+'</button>').join("");
  return '<div class="task"><div style="display:flex;gap:6px">'+seg+'</div>'
   +(up?inp("n","text","الاسم (اختياري)","name"):"")+inp("e","email","البريد الإلكتروني","email")+inp("p","password","كلمة المرور",up?"new-password":"current-password")
   +(AUTH.err?'<div style="color:#d33;font-size:13px;margin-top:8px">'+AUTH.err+'</div>':"")
   +(AUTH.info?'<div style="color:#16a34a;font-size:13px;margin-top:8px">'+AUTH.info+'</div>':"")
   +'<button style="width:100%;margin-top:12px"'+dis+' onclick="aSubmit()">'+T(up?"إنشاء الحساب":"تسجيل الدخول")+'</button>'
   +(up?"":'<button class="del" style="width:100%;margin-top:6px;font-size:14px" onclick="aReset()">'+T("نسيت كلمة المرور؟")+'</button>')
   +'<div style="display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--mute);font-size:13px"><span style="flex:1;height:1px;background:var(--line)"></span>'+T("أو")+'<span style="flex:1;height:1px;background:var(--line)"></span></div>'
   +'<button class="ghost" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px"'+dis+' onclick="aGoogle()">'+lnkBadge("g",24)+'<span>'+T("المتابعة مع جوجل")+'</span></button>'
   +'<div class="sub" style="margin-top:12px">'+T(fb?"تسجيل الدخول بجوجل حقيقي، وبياناتك تُحفظ وتتزامن على حسابك بين كل أجهزتك.":"هذه معاينة: التسجيل الحقيقي يعمل داخل التطبيق بعد ربط Firebase.")+'</div></div>';
};
/* ترحيل مرة واحدة: ما كان مسجّلًا قديمًا من خانة "كم أنجزت" يصير "إنجاز سابق" لكل المهام */
(function(){
  let ch=false;
  tasks.forEach(t=>{
    if(t.prev!==undefined)return;
    const h=t.hist||[],s=h.filter(x=>!x.m).reduce((q,x)=>q+(+x.a||0),0);
    if(s>0){t.prev=Math.min(s,+t.done||s);t.prevUsed=true;t.hist=h.filter(x=>x.m);if(t.finished&&t.prev>=t.done)delete t.fin}
    else t.prev=0;
    ch=true;
  });
  tasks.forEach(t=>{if(t.finished&&(+t.done||0)<t.target){t.finished=false;delete t.fin;ch=true}});
  if(ch){save();render()}
})();
function fillPr(){[["tprw","tpr"],["rprw","rpr"]].forEach(p=>{const w=document.getElementById(p[0]);if(!w)return;const o=document.getElementById(p[1]);w.innerHTML=prSel(p[1],o?+o.value:-1)})}
{const _al=applyLang;applyLang=function(){const r=_al.apply(this,arguments);fillPr();return r}}
fillPr();

cloudInit();
</script>
